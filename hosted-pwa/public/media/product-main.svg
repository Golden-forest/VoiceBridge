<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Cross-device input product screenshot placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffbf5" />
      <stop offset="1" stop-color="#fff5eb" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f97316" />
      <stop offset="1" stop-color="#c2410c" />
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1600" height="1000" fill="url(#bg)" />
  <rect x="0" y="0" width="1600" height="1000" fill="none" stroke="#e8793a" stroke-opacity="0.18" stroke-width="2" />

  <!-- Phone abstraction (left) -->
  <g transform="translate(220, 200)">
    <rect x="0" y="0" width="280" height="600" rx="40" fill="#ffffff" stroke="rgba(120,70,35,0.16)" />
    <rect x="20" y="60" width="240" height="40" rx="8" fill="#fdba74" opacity="0.4" />
    <circle cx="50" cy="540" r="34" fill="url(#accent)" />
    <rect x="120" y="528" width="120" height="24" rx="12" fill="#ea580c" opacity="0.3" />
  </g>

  <!-- Arrow -->
  <path d="M540 500 L760 500" stroke="url(#accent)" stroke-width="10" stroke-linecap="round" />
  <path d="M740 470 L780 500 L740 530 Z" fill="#f97316" />

  <!-- Desktop abstraction (right) -->
  <g transform="translate(820, 180)">
    <rect x="0" y="0" width="560" height="380" rx="16" fill="#ffffff" stroke="rgba(120,70,35,0.16)" />
    <rect x="32" y="40" width="160" height="14" rx="7" fill="#1c1917" />
    <rect x="32" y="90" width="496" height="42" rx="6" fill="#fff5eb" />
    <rect x="40" y="100" width="220" height="22" rx="6" fill="#1c1917" />
    <rect x="32" y="160" width="496" height="42" rx="6" fill="#fff5eb" />
    <rect x="40" y="170" width="180" height="22" rx="6" fill="url(#accent)" />
    <rect x="32" y="240" width="300" height="14" rx="7" fill="#625b55" opacity="0.4" />
    <rect x="32" y="280" width="240" height="14" rx="7" fill="#625b55" opacity="0.4" />
  </g>

  <text x="800" y="780" font-family="'Nunito','PingFang SC','Microsoft YaHei UI',sans-serif" font-size="40" font-weight="700" fill="#1c1917" text-anchor="middle">Cross-device input</text>
  <text x="800" y="840" font-family="'PingFang SC','Microsoft YaHei UI','Noto Sans SC',sans-serif" font-size="32" font-weight="600" fill="#625b55" text-anchor="middle">跨设备输入 · 产品截图占位</text>
</svg>
