<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Product demo coming soon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1310" />
      <stop offset="1" stop-color="#0d0a08" />
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#f97316" stop-opacity="0.18" />
      <stop offset="1" stop-color="#f97316" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f97316" />
      <stop offset="1" stop-color="#c2410c" />
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1600" height="1000" fill="url(#bg)" />
  <rect x="0" y="0" width="1600" height="1000" fill="url(#glow)" />

  <!-- Play icon -->
  <circle cx="800" cy="430" r="92" fill="none" stroke="url(#ring)" stroke-width="6" />
  <circle cx="800" cy="430" r="76" fill="url(#ring)" opacity="0.18" />
  <path d="M776 388 L832 430 L776 472 Z" fill="#fdba74" />

  <text x="800" y="610" font-family="'Nunito','PingFang SC','Microsoft YaHei UI',sans-serif" font-size="46" font-weight="700" fill="#f4f1ed" text-anchor="middle">Product demo coming soon</text>
  <text x="800" y="680" font-family="'PingFang SC','Microsoft YaHei UI','Noto Sans SC',sans-serif" font-size="38" font-weight="600" fill="#c1bdb7" text-anchor="middle">产品演示即将上线</text>
