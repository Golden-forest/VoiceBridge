<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1400" width="1000" height="1400" role="img" aria-label="Preset library screenshot placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffbf5" />
      <stop offset="1" stop-color="#ffffff" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f97316" />
      <stop offset="1" stop-color="#c2410c" />
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1000" height="1400" fill="url(#bg)" />
  <rect x="0" y="0" width="1000" height="1400" fill="none" stroke="rgba(120,70,35,0.16)" stroke-width="2" />

  <!-- Header -->
  <text x="80" y="120" font-family="'Nunito','PingFang SC','Microsoft YaHei UI',sans-serif" font-size="52" font-weight="800" fill="#1c1917">Commands</text>
  <text x="80" y="170" font-family="'Nunito','PingFang SC','Microsoft YaHei UI',sans-serif" font-size="24" font-weight="600" fill="#625b55">指令库</text>

  <!-- Search bar -->
  <rect x="80" y="220" width="840" height="60" rx="10" fill="#ffffff" stroke="rgba(120,70,35,0.16)" />
  <circle cx="120" cy="250" r="14" fill="none" stroke="#625b55" stroke-width="3" />
  <line x1="132" y1="262" x2="146" y2="276" stroke="#625b55" stroke-width="3" stroke-linecap="round" />

  <!-- Command rows -->
  <g font-family="'Nunito','PingFang SC','Microsoft YaHei UI',sans-serif" font-size="32" font-weight="700" fill="#1c1917">
    <g transform="translate(0, 340)">
      <rect x="80" y="0" width="840" height="100" rx="14" fill="#fff5eb" />
      <rect x="100" y="30" width="10" height="40" rx="5" fill="url(#accent)" />
      <text x="140" y="62">Minimal changes</text>
      <text x="780" y="62" font-size="22" font-weight="600" fill="#625b55">Preset</text>
    </g>
    <g transform="translate(0, 470)">
      <rect x="80" y="0" width="840" height="100" rx="14" fill="#ffffff" stroke="rgba(120,70,35,0.12)" />
      <rect x="100" y="30" width="10" height="40" rx="5" fill="url(#accent)" />
      <text x="140" y="62">Code review</text>
      <text x="780" y="62" font-size="22" font-weight="600" fill="#625b55">Preset</text>
    </g>
    <g transform="translate(0, 600)">
      <rect x="80" y="0" width="840" height="100" rx="14" fill="#fff5eb" />
      <rect x="100" y="30" width="10" height="40" rx="5" fill="url(#accent)" />
      <text x="140" y="62">UI design</text>
      <text x="780" y="62" font-size="22" font-weight="600" fill="#625b55">Preset</text>
    </g>
    <g transform="translate(0, 730)">
      <rect x="80" y="0" width="840" height="100" rx="14" fill="#ffffff" stroke="rgba(120,70,35,0.12)" />
      <rect x="100" y="30" width="10" height="40" rx="5" fill="url(#accent)" />
      <text x="140" y="62">Quick overview</text>
      <text x="780" y="62" font-size="22" font-weight="600" fill="#625b55">Preset</text>
    </g>
    <g transform="translate(0, 860)">
      <rect x="80" y="0" width="840" height="100" rx="14" fill="#fff5eb" />
      <rect x="100" y="30" width="10" height="40" rx="5" fill="#625b55" opacity="0.4" />
      <text x="140" y="62" fill="#625b55" opacity="0.7">...</text>
    </g>
  </g>

  <text x="500" y="1240" font-family="'Nunito','PingFang SC','Microsoft YaHei UI',sans-serif" font-size="28" font-weight="600" fill="#625b55" text-anchor="middle">Preset library screenshot placeholder</text>
  <text x="500" y="1290" font-family="'PingFang SC','Microsoft YaHei UI','Noto Sans SC',sans-serif" font-size="24" font-weight="600" fill="#625b55" text-anchor="middle">指令库截图占位</text>
</svg>
