<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="VoiceBridge">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1810" />
      <stop offset="0.6" stop-color="#1a1310" />
      <stop offset="1" stop-color="#0d0a08" />
    </linearGradient>
    <radialGradient id="glow1" cx="0.85" cy="0.15" r="0.55">
      <stop offset="0" stop-color="#ea580c" stop-opacity="0.55" />
      <stop offset="1" stop-color="#ea580c" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow2" cx="0.1" cy="0.95" r="0.45">
      <stop offset="0" stop-color="#f97316" stop-opacity="0.35" />
      <stop offset="1" stop-color="#f97316" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f97316" />
      <stop offset="1" stop-color="#fdba74" />
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1200" height="630" fill="url(#bg)" />
  <rect x="0" y="0" width="1200" height="630" fill="url(#glow1)" />
  <rect x="0" y="0" width="1200" height="630" fill="url(#glow2)" />

  <!-- Brand mark -->
  <g transform="translate(120, 220)">
    <rect x="0" y="0" width="56" height="56" rx="14" fill="url(#accent)" />
    <path d="M16 18 L28 38 L40 18" fill="none" stroke="#1c1917" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <text x="200" y="260" font-family="'Nunito','PingFang SC','Microsoft YaHei UI',sans-serif" font-size="64" font-weight="800" fill="#f4f1ed" letter-spacing="-1">VoiceBridge</text>

  <!-- Tagline -->
  <text x="120" y="360" font-family="'Nunito','PingFang SC','Microsoft YaHei UI',sans-serif" font-size="44" font-weight="700" fill="#f4f1ed">Speak on your phone.</text>
  <text x="120" y="430" font-family="'Nunito','PingFang SC','Microsoft YaHei UI',sans-serif" font-size="44" font-weight="800" fill="url(#accent)">Type on your computer.</text>

  <!-- Footer hint -->
  <text x="120" y="540" font-family="'Nunito',sans-serif" font-size="22" font-weight="600" fill="#c1bdb7">voicebridge-6kr.pages.dev</text>
</svg>
