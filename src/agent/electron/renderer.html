<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;"
    >
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VoiceBridge Agent</title>
    <style>
      /* === Web Fonts (Variable, latin subset, Electron-local) === */
      @font-face {
        font-family: "Nunito";
        font-style: normal;
        font-weight: 400 800;
        font-display: swap;
        src: url("./fonts/Nunito-Variable.woff2") format("woff2");
      }
      @font-face {
        font-family: "JetBrains Mono";
        font-style: normal;
        font-weight: 400 700;
        font-display: swap;
        src: url("./fonts/JetBrainsMono-Variable.woff2") format("woff2");
      }

      :root {
        color-scheme: light dark;
        --font-sans: "SF Pro Rounded", "Nunito", -apple-system, BlinkMacSystemFont,
                     "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
        --font-mono: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
        font-family: var(--font-sans);
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: #f6f7f9;
        color: #17202a;
      }

      main {
        box-sizing: border-box;
        display: flex;
        min-height: 100vh;
        flex-direction: column;
        gap: 24px;
        padding: 32px;
      }

      h1,
      p {
        margin: 0;
      }

      h1 {
        font-size: 24px;
        font-weight: 800;
      }

      .status {
        display: grid;
        gap: 12px;
        padding: 16px;
        border: 1px solid #d9dee7;
        border-radius: 8px;
        background: #ffffff;
      }

      .status-row {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        font-size: 14px;
      }

      .status-value {
        color: #23715d;
        font-weight: 800;
      }

      .status-value.error {
        color: #b42318;
      }

      form {
        display: grid;
        gap: 14px;
      }

      label {
        display: grid;
        gap: 6px;
        font-size: 13px;
        font-weight: 700;
      }

      input {
        box-sizing: border-box;
        width: 100%;
        border: 1px solid #c8ced8;
        border-radius: 6px;
        padding: 11px 12px;
        font: inherit;
      }

      button {
        border: 0;
        border-radius: 6px;
        padding: 12px 14px;
        background: #1f6feb;
        color: #ffffff;
        font: inherit;
        font-weight: 800;
      }

      .hint {
        color: #667085;
        font-size: 13px;
        line-height: 1.5;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: #101418;
          color: #eef2f6;
        }

        .status {
          border-color: #303946;
          background: #171d24;
        }

        input {
          border-color: #3a4655;
          background: #101418;
          color: #eef2f6;
        }

        .hint {
          color: #a7b0bd;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>VoiceBridge Agent</h1>
        <p class="hint">登录后保持本机输入代理在线。</p>
      </header>

      <section class="status" aria-label="连接状态">
        <div class="status-row">
          <span>连接状态</span>
          <span class="status-value">等待登录</span>
        </div>
        <div class="status-row">
          <span>版本</span>
          <span id="version">读取中</span>
        </div>
      </section>

      <form id="loginForm">
        <label>
          邮箱
          <input id="emailInput" type="email" autocomplete="email" placeholder="you@example.com" required>
        </label>
        <label>
          密码
          <input id="passwordInput" type="password" autocomplete="current-password" placeholder="请输入密码" required>
        </label>
        <button id="loginButton" type="submit">登录并上线</button>
        <button id="logoutButton" type="button" hidden>退出登录</button>
        <p id="message" class="hint" role="status"></p>
      </form>
    </main>

    <script>
      const statusEl = document.querySelector('.status-value');
      const versionEl = document.querySelector('#version');
      const form = document.querySelector('#loginForm');
      const emailInput = document.querySelector('#emailInput');
      const passwordInput = document.querySelector('#passwordInput');
      const loginButton = document.querySelector('#loginButton');
      const logoutButton = document.querySelector('#logoutButton');
      const messageEl = document.querySelector('#message');

      function setStatus(message, isError = false) {
        statusEl.textContent = message;
        statusEl.classList.toggle('error', isError);
      }

      function setMessage(message, isError = false) {
        messageEl.textContent = message;
        messageEl.style.color = isError ? '#b42318' : '';
      }

      window.voicebridge?.version().then((version) => {
        versionEl.textContent = version;
      });

      window.voicebridge?.publicConfig().then((config) => {
        if (!config.hasSupabaseAnonKey) {
          setStatus('缺少配置', true);
          setMessage('缺少 Supabase anon key。打包前请配置桌面端公开 Supabase 配置。', true);
          loginButton.disabled = true;
        }
      });

      window.voicebridge?.onAgentStatus((status) => {
        setStatus(status);
      });

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        loginButton.disabled = true;
        setMessage('');
        setStatus('正在登录');
        try {
          const result = await window.voicebridge.login({
            email: emailInput.value.trim(),
            password: passwordInput.value
          });
          setStatus('已上线');
          setMessage(`桌面端已上线：${result.deviceName}`);
          logoutButton.hidden = false;
          passwordInput.value = '';
        } catch (error) {
          setStatus('登录失败', true);
          setMessage(error.message || '登录失败，请稍后重试。', true);
        } finally {
          loginButton.disabled = false;
        }
      });

      logoutButton.addEventListener('click', async () => {
        logoutButton.disabled = true;
        try {
          await window.voicebridge.logout();
          logoutButton.hidden = true;
          setStatus('等待登录');
          setMessage('已退出登录。');
        } catch (error) {
          setMessage(error.message || '退出失败，请稍后重试。', true);
        } finally {
          logoutButton.disabled = false;
        }
      });
    </script>
  </body>
</html>
