<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;"
    >
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VoiceBridge Agent</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: #f6f7f9;
        color: #17202a;
      }

      main {
        box-sizing: border-box;
        display: flex;
        min-height: 100vh;
        flex-direction: column;
        gap: 24px;
        padding: 32px;
      }

      h1,
      p {
        margin: 0;
      }

      h1 {
        font-size: 24px;
        font-weight: 700;
      }

      .status {
        display: grid;
        gap: 12px;
        padding: 16px;
        border: 1px solid #d9dee7;
        border-radius: 8px;
        background: #ffffff;
      }

      .status-row {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        font-size: 14px;
      }

      .status-value {
        color: #23715d;
        font-weight: 700;
      }

      form {
        display: grid;
        gap: 14px;
      }

      label {
        display: grid;
        gap: 6px;
        font-size: 13px;
        font-weight: 600;
      }

      input {
        box-sizing: border-box;
        width: 100%;
        border: 1px solid #c8ced8;
        border-radius: 6px;
        padding: 11px 12px;
        font: inherit;
      }

      button {
        border: 0;
        border-radius: 6px;
        padding: 12px 14px;
        background: #1f6feb;
        color: #ffffff;
        font: inherit;
        font-weight: 700;
      }

      .hint {
        color: #667085;
        font-size: 13px;
        line-height: 1.5;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: #101418;
          color: #eef2f6;
        }

        .status {
          border-color: #303946;
          background: #171d24;
        }

        input {
          border-color: #3a4655;
          background: #101418;
          color: #eef2f6;
        }

        .hint {
          color: #a7b0bd;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>VoiceBridge Agent</h1>
        <p class="hint">登录后保持本机输入代理在线。</p>
      </header>

      <section class="status" aria-label="连接状态">
        <div class="status-row">
          <span>连接状态</span>
          <span class="status-value">等待登录</span>
        </div>
        <div class="status-row">
          <span>版本</span>
          <span id="version">读取中</span>
        </div>
      </section>

      <form>
        <label>
          邮箱
          <input type="email" autocomplete="email" placeholder="you@example.com">
        </label>
        <label>
          密码
          <input type="password" autocomplete="current-password" placeholder="请输入密码">
        </label>
        <button type="button">登录</button>
      </form>
    </main>

    <script>
      window.voicebridge?.version().then((version) => {
        document.querySelector('#version').textContent = version;
      });
    </script>
  </body>
</html>
