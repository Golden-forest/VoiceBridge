<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;"
    >
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VoiceBridge Agent</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #201b24;
        background: #f7f6f9;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
        background:
          radial-gradient(circle at 90% 0%, rgba(255, 178, 196, 0.26), transparent 34%),
          #f7f6f9;
        color: #201b24;
      }
      main {
        display: grid;
        min-height: 100vh;
        align-content: start;
        gap: 14px;
        padding: 24px 26px 18px;
      }
      header {
        display: flex;
        align-items: center;
        gap: 13px;
      }
      header img {
        width: 52px;
        height: 52px;
        border-radius: 15px;
        box-shadow: 0 10px 24px rgba(240, 82, 115, 0.18);
      }
      h1, h2, p { margin: 0; }
      h1 {
        font-size: 22px;
        letter-spacing: -0.035em;
      }
      .hint {
        color: #746a77;
        font-size: 12px;
        line-height: 1.55;
      }
      .eyebrow {
        margin-bottom: 3px;
        color: #938797;
        font-size: 9px;
        font-weight: 800;
        letter-spacing: .12em;
      }
      .status {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 42px;
        padding: 10px 13px;
        border: 1px solid #e6e1e7;
        border-radius: 13px;
        background: rgba(255, 255, 255, .82);
        font-size: 12px;
        font-weight: 650;
      }
      .status-value {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        color: #23715d;
        font-weight: 800;
      }
      .status-value::before {
        content: "";
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: currentColor;
        box-shadow: 0 0 0 4px rgba(35, 113, 93, .1);
      }
      .status-value.error { color: #b42318; }
      .panel {
        display: grid;
        justify-items: center;
        gap: 10px;
        padding: 17px;
        border: 1px solid rgba(56, 44, 61, .08);
        border-radius: 22px;
        background: #fff;
        box-shadow: 0 18px 50px rgba(67, 45, 72, .1);
        text-align: center;
      }
      .panel[hidden] { display: none; }
      .panel h2 {
        font-size: 19px;
        letter-spacing: -0.03em;
      }
      #qrImage {
        width: 230px;
        height: 230px;
        padding: 9px;
        border: 1px solid #eee9ef;
        border-radius: 18px;
        background: #fff;
        image-rendering: pixelated;
      }
      .device-name {
        max-width: 100%;
        overflow: hidden;
        color: #4a3f4e;
        font-size: 12px;
        font-weight: 750;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      button, a.button {
        display: inline-flex;
        min-height: 40px;
        align-items: center;
        justify-content: center;
        border: 1px solid #211b25;
        border-radius: 12px;
        padding: 9px 14px;
        background: #211b25;
        color: #fff;
        font: inherit;
        font-size: 12px;
        font-weight: 750;
        text-decoration: none;
        white-space: nowrap;
        cursor: pointer;
        transition: transform 120ms ease, background 160ms ease;
      }
      button:hover, a.button:hover {
        background: #352d39;
      }
      button:active, a.button:active {
        transform: scale(.98);
      }
      button.secondary {
        border-color: #d9d3db;
        background: #fff;
        color: #4a3f4e;
      }
      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        width: 100%;
        margin-top: 2px;
      }
      .privacy-setting {
        display: flex;
        width: 100%;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        border-top: 1px solid #eee9ef;
        padding-top: 12px;
        color: #4a3f4e;
        font-size: 12px;
        text-align: left;
      }
      .privacy-setting input {
        width: 18px;
        height: 18px;
        accent-color: #211b25;
      }
      .footer {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        padding: 0 2px;
      }
      #message.error {
        color: #b42318;
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          transition-duration: .01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <img src="../../../assets/icon.png" alt="">
        <div>
          <p class="eyebrow">VOICEBRIDGE DESKTOP</p>
          <h1>连接你的手机</h1>
          <p class="hint">扫码登录，无需在电脑输入密码</p>
        </div>
      </header>

      <section class="status" aria-label="连接状态">
        <span>连接状态</span>
        <span class="status-value">正在初始化</span>
      </section>

      <section id="pairingPanel" class="panel" hidden>
        <h2>手机扫码绑定</h2>
        <img id="qrImage" alt="VoiceBridge 手机配对二维码">
        <p class="device-name" id="deviceName"></p>
        <p class="hint">扫码后可以登录或注册，再确认绑定。二维码 10 分钟内有效。</p>
        <div class="actions">
          <button id="refreshButton" type="button">刷新二维码</button>
          <a id="phoneUrl" class="button" href="#" target="_blank" rel="noreferrer">打开手机网页</a>
        </div>
      </section>

      <section id="onlinePanel" class="panel" hidden>
        <h2>电脑端已上线</h2>
        <p class="device-name" id="onlineDeviceName"></p>
        <p class="hint">现在可以在手机端录音。转写完成后会自动发送并粘贴到这台电脑。</p>
        <label class="privacy-setting">
          <span>向手机显示完整窗口标题</span>
          <input id="reportWindowTitles" type="checkbox">
        </label>
        <button id="unpairButton" class="secondary" type="button">解除绑定</button>
      </section>

      <footer class="footer">
        <p id="message" class="hint" role="status"></p>
        <p class="hint">
          <a href="https://voicebridge-6kr.pages.dev/privacy.html" style="color:inherit;text-decoration:underline" target="_blank" rel="noopener">隐私政策</a>
          ·
          <a href="https://voicebridge-6kr.pages.dev/terms.html" style="color:inherit;text-decoration:underline" target="_blank" rel="noopener">用户协议</a>
          ·
          <a href="https://voicebridge-6kr.pages.dev/faq.html" style="color:inherit;text-decoration:underline" target="_blank" rel="noopener">常见问题</a>
          ·
          v<span id="version">…</span>
        </p>
      </footer>
    </main>

    <script>
      const statusEl = document.querySelector('.status-value');
      const pairingPanel = document.querySelector('#pairingPanel');
      const onlinePanel = document.querySelector('#onlinePanel');
      const qrImage = document.querySelector('#qrImage');
      const deviceName = document.querySelector('#deviceName');
      const onlineDeviceName = document.querySelector('#onlineDeviceName');
      const refreshButton = document.querySelector('#refreshButton');
      const unpairButton = document.querySelector('#unpairButton');
      const reportWindowTitles = document.querySelector('#reportWindowTitles');
      const phoneUrl = document.querySelector('#phoneUrl');
      const messageEl = document.querySelector('#message');

      function setStatus(message, isError = false) {
        statusEl.textContent = message;
        statusEl.classList.toggle('error', isError);
      }

      function setMessage(message, isError = false) {
        messageEl.textContent = message;
        messageEl.classList.toggle('error', isError);
      }

      function renderState(state) {
        pairingPanel.hidden = state?.mode !== 'pairing';
        onlinePanel.hidden = state?.mode !== 'online';
        if (state?.mode === 'pairing') {
          setStatus('等待手机扫码');
          qrImage.src = state.qrDataUrl;
          deviceName.textContent = state.deviceName || '';
          setMessage('请用手机相机扫描二维码。');
        } else if (state?.mode === 'online') {
          setStatus('已上线');
          onlineDeviceName.textContent = state.deviceName || '';
          setMessage('绑定成功，保持此应用运行即可。');
          reportWindowTitles.checked = Boolean(state.reportWindowTitles);
        }
      }

      window.voicebridge?.version().then((version) => {
        document.querySelector('#version').textContent = version;
      });
      window.voicebridge?.publicConfig().then((config) => {
        phoneUrl.href = config.webAppUrl;
      });
      window.voicebridge?.onDesktopState(renderState);
      window.voicebridge?.onAgentStatus((status) => {
        if (String(status).includes('SUBSCRIBED')) setStatus('已上线');
      });

      refreshButton.addEventListener('click', async () => {
        refreshButton.disabled = true;
        setStatus('正在刷新');
        try {
          renderState(await window.voicebridge.refreshPairing());
        } catch (error) {
          setStatus('刷新失败', true);
          setMessage(error.message || '刷新二维码失败。', true);
        } finally {
          refreshButton.disabled = false;
        }
      });

      unpairButton.addEventListener('click', async () => {
        unpairButton.disabled = true;
        setStatus('正在解除绑定');
        try {
          renderState(await window.voicebridge.unpair());
        } catch (error) {
          setStatus('操作失败', true);
          setMessage(error.message || '解除绑定失败。', true);
        } finally {
          unpairButton.disabled = false;
        }
      });

      reportWindowTitles.addEventListener('change', async () => {
        reportWindowTitles.disabled = true;
        try {
          await window.voicebridge.updateSettings({
            reportWindowTitles: reportWindowTitles.checked
          });
          setMessage(reportWindowTitles.checked
            ? '窗口标题会通过加密连接显示在你的手机上。'
            : '仅向手机显示应用名称。');
        } catch (error) {
          reportWindowTitles.checked = !reportWindowTitles.checked;
          setMessage(error.message || '保存隐私设置失败。', true);
        } finally {
          reportWindowTitles.disabled = false;
        }
      });

      setStatus('正在初始化');
      window.voicebridge?.initialize()
        .then(renderState)
        .catch((error) => {
          setStatus('初始化失败', true);
          setMessage(error.message || '无法初始化电脑端。', true);
        });
    </script>
  </body>
</html>
