<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VoiceBridge</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="shell">
      <section class="panel">
        <header>
          <p class="eyebrow">VoiceBridge</p>
          <h1>语音输入</h1>
          <p id="status" class="status">正在连接电脑端...</p>
        </header>

        <label class="switch">
          <input id="autoPaste" type="checkbox" checked />
          <span>自动粘贴到电脑当前输入框</span>
        </label>

        <button id="recordButton" class="record-button" type="button">
          <span class="record-icon record-icon-mic">
            <svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0014 0"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
          </span>
          <span class="record-label">点击录音</span>
          <span class="record-sub">再次点击停止并发送</span>
        </button>

        <div class="action-row">
          <button id="undoButton" class="action-button undo-button" type="button">
            <svg viewBox="0 0 24 24" width="18" height="18"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 102.13-9.36L1 10"/></svg>
            撤销
          </button>
          <button id="enterButton" class="action-button enter-button" type="button">
            <svg viewBox="0 0 24 24" width="18" height="18"><polyline points="13 17 18 12 13 7"/><line x1="6" y1="12" x2="18" y2="12"/></svg>
            回车
          </button>
        </div>

        <button id="fallbackButton" class="fallback-button hidden" type="button">
          录音或选择音频上传
        </button>
        <input id="fallbackFile" class="hidden" type="file" accept="audio/*" capture />

        <section class="result">
          <div class="result-label">识别结果</div>
          <p id="resultText">等待录音</p>
        </section>
      </section>
    </main>

    <script src="/app.js" type="module"></script>
  </body>
</html>
