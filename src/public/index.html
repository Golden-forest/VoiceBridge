<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VoiceBridge</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="shell">
      <section class="panel">
        <header>
          <p class="eyebrow">VoiceBridge</p>
          <h1>语音输入</h1>
          <p id="status" class="status">正在连接电脑端...</p>
        </header>

        <label class="switch">
          <input id="autoPaste" type="checkbox" checked />
          <span>自动粘贴到电脑当前输入框</span>
        </label>

        <button id="recordButton" class="record-button" type="button">
          <span class="record-icon record-icon-mic">
            <svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0014 0"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
          </span>
          <span class="record-label">点击录音</span>
          <span class="record-sub">再次点击停止并发送</span>
        </button>

        <div class="action-row">
          <button id="undoButton" class="action-button undo-button" type="button">
            <svg viewBox="0 0 24 24" width="18" height="18"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 102.13-9.36L1 10"/></svg>
            撤销
          </button>
          <button id="enterButton" class="action-button enter-button" type="button">
            <svg viewBox="0 0 24 24" width="18" height="18"><polyline points="13 17 18 12 13 7"/><line x1="6" y1="12" x2="18" y2="12"/></svg>
            回车
          </button>
        </div>

        <button id="fallbackButton" class="fallback-button hidden" type="button">
          录音或选择音频上传
        </button>
        <input id="fallbackFile" class="hidden" type="file" accept="audio/*" capture />

        <div id="phrasesDrawer" class="phrases-drawer">
          <button id="phrasesToggle" class="phrases-toggle" type="button">
            <span id="phrasesToggleIcon">▶</span>
            常用语 <span id="phrasesCount">(0)</span>
          </button>
          <div id="phrasesPanel" class="phrases-panel hidden">
            <div class="phrases-header">
              <span>常用语 <span id="phrasesPanelCount">(0)</span></span>
              <div class="phrases-header-actions">
                <button id="phrasesAddBtn" class="phrases-add-btn" type="button">+ 新增</button>
                <button id="phrasesEditDoneBtn" class="phrases-edit-done-btn hidden" type="button">完成</button>
              </div>
            </div>
            <ul id="phrasesList" class="phrases-list"></ul>
          </div>
        </div>

        <section class="result">
          <div class="result-label">识别结果</div>
          <p id="resultText">等待录音</p>
          <button id="savePhraseBtn" class="save-phrase-btn hidden" type="button">
            <svg viewBox="0 0 24 24" width="16" height="16"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            收藏为常用语
          </button>
        </section>
      </section>
    </main>

    <script src="/app.js" type="module"></script>

    <div id="addPhraseDialog" class="add-phrase-dialog hidden">
      <div class="add-phrase-overlay"></div>
      <div class="add-phrase-content">
        <h3>新增常用语</h3>
        <textarea id="addPhraseInput" class="add-phrase-input" rows="3" placeholder="输入常用语内容…"></textarea>
        <div class="add-phrase-actions">
          <button id="addPhraseCancelBtn" class="add-phrase-cancel-btn" type="button">取消</button>
          <button id="addPhraseConfirmBtn" class="add-phrase-confirm-btn" type="button">保存</button>
        </div>
      </div>
    </div>
  </body>
</html>
